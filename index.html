<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAILYMOON - 1000+ Movies & Web Series</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0a;color:#e5e5e5;font-family:system-ui;padding:20px}
    h1{text-align:center;margin:20px 0;color:#0ff;font-size:2.5rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;max-width:1400px;margin:0 auto}
    .card{background:#1a1a1a;border-radius:16px;overflow:hidden;cursor:pointer;transition:0.2s}
    .card:hover{transform:scale(1.02);border:1px solid #0ff}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover}
    .title{padding:10px;font-size:0.8rem;text-align:center}
    footer{text-align:center;margin-top:40px;padding:20px;color:#666}
    .load-more-btn{display:block;width:200px;margin:30px auto;background:#0ff;color:#000;text-align:center;padding:12px;border-radius:40px;cursor:pointer}
    .nav-links{display:flex;justify-content:center;gap:20px;margin:20px 0}
    .nav-links a{color:#0ff;text-decoration:none}
  </style>
</head>
<body>
<h1>🌙 DAILYMOON</h1>
<div class="nav-links">
  <a href="/">Home</a>
  <a href="/about.html">About</a>
  <a href="/dmca.html">DMCA</a>
  <a href="/security.html">Security</a>
</div>
<div class="grid" id="movieGrid"></div>
<div class="load-more-btn" id="loadMoreBtn">Load More</div>
<footer>© DAILYMOON - Daily fresh content | Auto-sync every 12h</footer>

<script>
  let allMovies = [];
  let visibleCount = 20;
  
  async function loadMovies() {
    // सभी movie folders की list fetch करने के लिए हमें एक JSON file चाहिए।
    // चूँकि हमारे पास server-side नहीं है, हम एक static JSON बनाएँगे।
    // नीचे हम generateMoviesJson() को अलग से run करेंगे।
    const res = await fetch('/movies.json');
    allMovies = await res.json();
    renderMovies();
  }
  
  function renderMovies() {
    const grid = document.getElementById('movieGrid');
    const toShow = allMovies.slice(0, visibleCount);
    grid.innerHTML = toShow.map(m => `
      <div class="card" onclick="location.href='/movie/${m.id}/'">
        <img src="${m.thumbnail}" loading="lazy">
        <div class="title">${escapeHtml(m.title)}</div>
      </div>
    `).join('');
    document.getElementById('loadMoreBtn').style.display = visibleCount >= allMovies.length ? 'none' : 'block';
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
  }
  
  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    visibleCount += 20;
    renderMovies();
  });
  
  loadMovies();
</script>
</body>
</html>
