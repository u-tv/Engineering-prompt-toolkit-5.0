name: Daily Dailymotion Auto-Sync
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sync (preserve old data)
        env:
          DAILYMOTION_CLIENT_ID: ${{ secrets.DAILYMOTION_CLIENT_ID }}
          DAILYMOTION_CLIENT_SECRET: ${{ secrets.DAILYMOTION_CLIENT_SECRET }}
        run: node sync.js
      - name: Commit and push changes
        run: |
          git config user.name "Auto-Sync Bot"
          git config user.email "bot@dailymoon.com"
          git add movie/ movies.json sitemap.xml
          git commit -m "Auto-sync: added new videos (old preserved)" || exit 0
          git push https://${{ secrets.GH_PAT }}@github.com/u-tv/dailymoon.github.io.git main
