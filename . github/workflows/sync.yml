name: DailyMoon Auto Sync Content

on:
  schedule:
    - cron: '0 2 * * *' # हर रात 2 बजे ऑटोमैटिक रन होगा
  workflow_dispatch:

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Secure Sync Script
        env:
          DAILYMOTION_KEY: ${{ secrets.DAILYMOTION_KEY || '656242f6bd70036a2064' }}
        run: node generate.js

      - name: Push Updates back to Repo
        run: |
          git config --global user.name "DailyMoon-Bot"
          git config --global user.email "bot@dailymoon.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-Sync: Fresh Dailymotion Content Added" && git push)
