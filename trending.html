<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trending - DAILYMOON</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}.card{background:#111;border-radius:16px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:16/9}.title{padding:10px;text-align:center}</style>
</head>
<body><h1>🔥 Trending on DAILYMOON</h1><div class="grid" id="trendingGrid"></div><script>
fetch('/movies.json').then(r=>r.json()).then(data=>{
  const trending = data.slice(0,50); // first 50 as trending
  document.getElementById('trendingGrid').innerHTML = trending.map(m=>`<div class="card" onclick="location.href='/movie/${m.id}/'"><img src="${m.thumb}" loading="lazy"><div class="title">${m.title}</div></div>`).join('');
});
</script></body></html>
