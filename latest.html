<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Trending - DAILYMOON</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}.card{background:#111;border-radius:16px;overflow:hidden;cursor:pointer}.card img{width:100%}.title{padding:10px}</style></head><body><h1>🔥 Trending Movies</h1><div class="grid" id="grid"></div><script>fetch('/movies.json').then(r=>r.json()).then(data=>{document.getElementById('grid').innerHTML=data.slice(0,50).map(m=>`<div class="card" onclick="location.href='/movie/${m.id}/'"><img src="${m.thumb}"><div class="title">${m.title}</div></div>`).join('');});</script><script src="/live-users.js"></script></body></html>
